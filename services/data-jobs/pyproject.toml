[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DTZ", "BLE", "RUF"]

[tool.ruff.lint.isort]
known-first-party = [
  "observability", "api_keys", "http_client", "universe", "lake", "status_feed", "collectors",
  "trend_metrics", "fundamentals", "prefs_api", "key_rotation_check", "short_interest", "options_daily", "backfill",
  "price_reconcile", "news_sentiment", "hourly_prices", "regulatory_feeds", "gov_contracts", "release_day",
  "release_links", "macro_daily",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
