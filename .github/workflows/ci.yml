name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/data-jobs/requirements-jobs.txt

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - uses: hashicorp/setup-terraform@v3

      - uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@v3

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/data-jobs/requirements-jobs.txt -r services/data-jobs/requirements-test.txt ruff pip-audit

      - name: Lint Python
        working-directory: services/data-jobs
        run: ruff check src tests scripts

      - name: Test Python
        working-directory: services/data-jobs
        run: pytest -q

      - name: Audit Python dependencies
        run: |
          pip-audit -r services/data-jobs/requirements-jobs.txt
          pip-audit -r services/data-jobs/requirements-test.txt

      - name: Check browser JavaScript syntax
        run: node --check apps/web/app.js

      - name: Format and validate Terraform
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - name: Build the Lambda image for its deployment architecture
        run: |
          docker buildx build --file infra/docker/Dockerfile --platform linux/arm64 --load -t investor-dashboard-jobs:ci .

      - name: Check infrastructure and workflow security
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: .
          framework: terraform,dockerfile,github_actions
          quiet: true
