name: CI

on:
  # Draft PRs skip CI; it runs when a PR is opened ready, marked ready for review, or pushed while ready.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [main]

permissions:
  contents: read

# Third-party actions are pinned to full commit SHAs (tag in the trailing comment).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  validate:
    if: github.event_name == 'push' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/data-jobs/requirements-jobs.txt

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "22"

      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.16.5"

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r services/data-jobs/requirements-jobs.txt -r services/data-jobs/requirements-test.txt ruff pip-audit

      - name: Lint Python
        working-directory: services/data-jobs
        run: ruff check src tests scripts

      - name: Test Python
        working-directory: services/data-jobs
        run: pytest -q

      - name: Audit Python dependencies
        run: |
          pip-audit -r services/data-jobs/requirements-jobs.txt
          pip-audit -r services/data-jobs/requirements-test.txt

      - name: Check browser JavaScript syntax
        run: |
          node --check apps/web/app.js
          node --check apps/web/chart-overlays.js
          node --check apps/web/chart-scale.js
          node --check apps/web/chart-period.js
          node --check apps/web/api-response.js
          node --check apps/web/trend-state.js
          node --check apps/web/settings-model.js
          node --check apps/web/account-settings.js
          node --check apps/web/theme.js
          node --check apps/web/signals.js
          node --check apps/web/roadmap.js
          node --check apps/web/routes.js
          node --check apps/web/stock-page.js

      - name: Test chart periods, overlays, trend state, API responses and preferences
        run: node --test apps/web/*.test.js

      - name: Format and validate Terraform
        working-directory: infra/terraform
        run: |
          terraform fmt -check -recursive
          terraform init -backend=false
          terraform validate

      - name: Build the Lambda image for its deployment architecture
        run: |
          docker buildx build --file infra/docker/Dockerfile --platform linux/arm64 --load -t investor-dashboard-jobs:ci .

      - name: Check infrastructure and workflow security
        uses: bridgecrewio/checkov-action@7b1bd992e2c40a3404e3511944aeb8d014703d9a # v12.3129.0
        with:
          directory: .
          framework: terraform,dockerfile,github_actions
          quiet: true
