name: Deploy production

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
  workflow_dispatch:

# Third-party actions are pinned to full commit SHAs (tag in the trailing comment).
permissions: {}

concurrency:
  group: investor-dashboard-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      (github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_run' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: ubuntu-latest
    timeout-minutes: 55 # the OIDC session lasts 1 hour
    environment: production
    permissions:
      contents: read
      id-token: write # OIDC token for the AWS role; only this job gets it
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false

      - name: Check deploy configuration
        env:
          AWS_DEPLOY_ROLE_ARN: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          AWS_REGION_VAR: ${{ vars.AWS_REGION }}
          TF_BACKEND_CONFIG: ${{ secrets.TF_BACKEND_CONFIG }}
          TERRAFORM_TFVARS: ${{ secrets.TERRAFORM_TFVARS }}
        run: |
          set -euo pipefail
          missing=""
          [ -n "$AWS_DEPLOY_ROLE_ARN" ] || missing="$missing secret:AWS_DEPLOY_ROLE_ARN"
          [ -n "$AWS_REGION_VAR" ] || missing="$missing variable:AWS_REGION"
          [ -n "$TF_BACKEND_CONFIG" ] || missing="$missing secret:TF_BACKEND_CONFIG"
          [ -n "$TERRAFORM_TFVARS" ] || missing="$missing secret:TERRAFORM_TFVARS"
          if [ -n "$missing" ]; then
            echo "::error::Set these in the GitHub 'production' environment:$missing (see docs/operations.md)"
            exit 1
          fi

      # Terraform CLI version chosen for this repository (the lock file pins providers, not the
      # CLI). The wrapper is off so $(terraform output -raw ...) captures only the value.
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd # v3.1.2
        with:
          terraform_version: "1.16.5"
          terraform_wrapper: false

      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - uses: aws-actions/configure-aws-credentials@7474bc4690e29a8392af63c5b98e7449536d5c3a # v4.3.1
        with:
          role-to-assume: ${{ secrets.AWS_DEPLOY_ROLE_ARN }}
          role-session-name: gha-deploy-${{ github.run_id }}-${{ github.run_attempt }}
          role-duration-seconds: 3600
          aws-region: ${{ vars.AWS_REGION }}

      - name: Prepare Terraform configuration
        working-directory: infra/terraform
        env:
          TF_BACKEND_CONFIG: ${{ secrets.TF_BACKEND_CONFIG }}
          TERRAFORM_TFVARS: ${{ secrets.TERRAFORM_TFVARS }}
        run: |
          set -euo pipefail
          test -n "$TF_BACKEND_CONFIG"
          test -n "$TERRAFORM_TFVARS"
          # This repository is public, so workflow logs are too. Terraform prints variable values
          # such as alert e-mail addresses in its plan output; mask every address in the tfvars.
          { grep -oE '[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,}' <<< "$TERRAFORM_TFVARS" || true; } | sort -u |
            while IFS= read -r value; do echo "::add-mask::${value}"; done
          umask 077
          printf '%s' "$TF_BACKEND_CONFIG" > backend.tf
          printf '%s' "$TERRAFORM_TFVARS" > terraform.tfvars

      - name: Initialize and provision base infrastructure
        working-directory: infra/terraform
        run: |
          set -euo pipefail
          terraform init -input=false
          # Snapshot state once. Do NOT use `terraform state list | grep -q` under pipefail:
          # when grep -q exits early on a match, state list gets SIGPIPE, the pipeline fails,
          # and `if ! …` treats "ECR exists" as "ECR missing", then applies with an empty
          # jobs_image_uri and destroys every job Lambda/schedule (Deploy 37496345092).
          mapfile -t TF_STATE < <(terraform state list)
          state_has() { printf '%s\n' "${TF_STATE[@]}" | grep -qx "$1"; }
          if state_has 'module.data_lake.aws_ecr_repository.jobs'; then
            echo "ECR repository already in state; skipping bootstrap apply."
          elif printf '%s\n' "${TF_STATE[@]}" | grep -q '^module\.jobs\.aws_lambda_function\.job\['; then
            echo "::error::Job Lambdas exist in state but the ECR repository does not; refusing empty jobs_image_uri apply."
            exit 1
          else
            echo "First-time bootstrap: creating base stack (no job image yet)."
            terraform apply -input=false -auto-approve -var='jobs_image_uri='
          fi
          echo "ECR_REPOSITORY=$(terraform output -raw ecr_repository_url)" >> "$GITHUB_ENV"

      - name: Verify Cognito branding migration prerequisites
        working-directory: infra/terraform
        run: |
          set -euo pipefail
          cognito="$(terraform output -json cognito)"
          pool_id="$(jq -r '.user_pool_id' <<< "$cognito")"
          login_url="$(jq -r '.hosted_ui_url' <<< "$cognito")"
          domain="${login_url#https://}"
          domain="${domain%%.auth.*}"
          current="$(aws cognito-idp describe-user-pool-domain --domain "$domain" --query 'DomainDescription.ManagedLoginVersion' --output text)"
          desired="$(terraform console <<< 'var.cognito_login_branding_version')"
          allowed="$(terraform console <<< 'var.cognito_allow_branding_migration')"
          if [ "$current" != "$desired" ] && [ "$allowed" != "true" ]; then
            echo "::error::Cognito branding is version ${current}, requested ${desired}. Review docs/operations.md and explicitly authorize the migration before changing the live login."
            exit 1
          fi
          if [ "$desired" = "2" ]; then
            tier="$(aws cognito-idp describe-user-pool --user-pool-id "$pool_id" --query 'UserPool.UserPoolTier' --output text)"
            if [ "$tier" != "ESSENTIALS" ] && [ "$tier" != "PLUS" ]; then
              echo "::error::Managed Login requires Essentials or Plus; do not change the feature plan as part of branding."
              exit 1
            fi
          fi

      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2.1.7

      - name: Build and publish the job image
        env:
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || github.sha }}
        run: |
          set -euo pipefail
          image_uri="${ECR_REPOSITORY}:${DEPLOY_SHA}-${GITHUB_RUN_ATTEMPT}"
          docker buildx build \
            --file infra/docker/Dockerfile \
            --platform linux/arm64 \
            --provenance=false \
            --push \
            --tag "$image_uri" \
            .
          echo "JOBS_IMAGE_URI=$image_uri" >> "$GITHUB_ENV"

      - name: Deploy job functions and generate site configuration
        working-directory: infra/terraform
        run: |
          set -euo pipefail
          # The image just pushed. Never fall back to empty: empty destroys the jobs module.
          if [ -z "${JOBS_IMAGE_URI:-}" ]; then
            echo "::error::JOBS_IMAGE_URI is empty; refusing terraform apply."
            exit 1
          fi
          terraform apply -input=false -auto-approve -var="jobs_image_uri=${JOBS_IMAGE_URI}"
          terraform output -json site_runtime_config > ../../apps/web/config.json
          site_output="$(terraform output -json site)"
          echo "SITE_BUCKET=$(jq -r '.bucket_name' <<< "$site_output")" >> "$GITHUB_ENV"
          echo "CLOUDFRONT_DISTRIBUTION_ID=$(jq -r '.distribution_id' <<< "$site_output")" >> "$GITHUB_ENV"

      - name: Publish static dashboard
        run: |
          set -euo pipefail
          aws s3 sync apps/web "s3://${SITE_BUCKET}" \
            --delete \
            --exclude config.example.json \
            --exclude package.json \
            --exclude "*.test.js"
          aws cloudfront create-invalidation \
            --distribution-id "${CLOUDFRONT_DISTRIBUTION_ID}" \
            --paths '/*'

      - name: Verify deployed site
        working-directory: infra/terraform
        run: |
          set -euo pipefail
          site_url="$(terraform output -json site | jq -r '.url')"
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors \
            "${site_url}/"
          curl --fail --silent --show-error --retry 12 --retry-delay 10 --retry-all-errors \
            "${site_url}/config.json" | jq -e '.apiBaseUrl and .clientId and .callbackUrl'
